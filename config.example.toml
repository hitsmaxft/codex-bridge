# Standalone is the recommended deployment on macOS and Linux. It avoids App
# bundle/runtime coupling. Use desktop only for explicit Desktop interposition.
mode = "standalone"

# Paths may be absolute or start with ~/.
# socket = "~/.codex-bridge/control.sock"
# codex_home = "~/.codex"
# Generated Chat workspaces default to ~/Documents/Codex/YYYY-MM-DD/<prompt-slug>.
# projectless_workspace_root = "~/Documents/Codex"
# codex_bin = "/absolute/path/to/codex"
# app_server_socket = "~/.codex-bridge/app-server.sock"
app_server_thread_cache = 3
# host_exec_policy = "~/.config/codex-bridge/host-exec-policy.json"

[web_ui]
enabled = false
# Optional browser title and top-left brand label.
name = "Codex App Server WebUI"
listen = "127.0.0.1:18791"
user = "codex"
# password_file = "~/.codex-bridge/web-ui-password"
# Optional direct HTTPS. Configure the PEM certificate chain and private key together.
# tls_cert_file = "~/.config/codex-bridge/tls/fullchain.pem"
# tls_private_key_file = "~/.config/codex-bridge/tls/private-key.pem"
no_auth = false
public_origins = []

[services]
# When enabled, codex-bridge starts or adopts and restarts `codex app-server`.
# The app-server stays alive while codex-bridge itself is upgraded or restarted.
manage_app_server = false
# Desktop mode can also supervise ws-unix-bridge and publish the launchd URL.
# With both options enabled, the managed app-server receives a disabled
# `mcp_servers.codex_app` base entry so Desktop can send its incremental tool list.
# An external process manager must pass the same `-c` override documented in docs/install.md.
desktop_interposition = false
ws_bridge_listen = "127.0.0.1:18790"
# ws_bridge_bin = "~/.cargo/bin/ws-unix-bridge"
# Optional environment passed only to the managed app-server child.
# [services.app_server_environment]
# HTTPS_PROXY = "http://127.0.0.1:7897"
# HTTP_PROXY = "http://127.0.0.1:7897"

# Optional local speech-to-text fallback. This requires a codex-bridge binary
# built with `--features whisper`. The daemon starts whisper-server only while
# app-server realtime transcription is unavailable.
[services.whisper]
enabled = false
bin = "whisper-server"
# model = "~/.local/share/whisper.cpp/ggml-base.bin"
listen = "127.0.0.1:18792"
language = "auto"
# threads = 4
